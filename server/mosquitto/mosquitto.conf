# BPI-R3 MQTT broker (chỉ mở trong vùng LAN của firewall)
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
persistence true
persistence_location /mnt/data/mosquitto/
autosave_interval 300
log_dest syslog
log_type error
log_type warning
log_type notice
