# NXP S32K144 (Cortex-M4F) qua SEGGER J-Link (vd OpenSDA của S32K144EVB chạy firmware J-Link), SWD.
# OpenOCD 0.12 không có target/s32k*.cfg và không có driver flash S32K1 (FTFC) → debug, đọc/ghi RAM, chạy code trong RAM;
# ghi flash dùng tools/s32k-flash (thuật toán FTFC chạy qua lệnh mww của OpenOCD).
# Cổng riêng để chạy song song với OpenOCD của ST-Link (3333/4444).
adapter driver jlink
transport select swd
adapter speed 1000

set _CHIPNAME s32k144
swd newdap $_CHIPNAME cpu -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 1
cortex_m reset_config sysresetreq
$_CHIPNAME.cpu configure -event gdb-detach { resume }

gdb_port 3334
telnet_port 4445
tcl_port disabled
