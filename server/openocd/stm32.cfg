# OpenOCD cho ST-Link cắm vào BPI-R3 (cài vào /etc/openocd/stm32.cfg).
# Đổi target theo chip: stm32f1x / stm32f4x / stm32g0x / stm32h7x / stm32l4x ...
source [find interface/stlink.cfg]
transport select hla_swd
# chip "clone" (CKS32, GD32, APM32…) có IDCODE khác ST: bỏ kiểm tra
set CPUTAPID 0
source [find target/stm32f1x.cfg]
adapter speed 1800
# chỉ nghe trên board; ra ngoài qua `tailscale serve` (chỉ máy trong tailnet của bạn)
bindto 127.0.0.1
gdb_port 3333
telnet_port 4444
tcl_port 6666
# GDB ngắt kết nối (kể cả IDE bị tắt ngang) -> cho chip chạy tiếp, không để treo ở trạng thái dừng
$_TARGETNAME configure -event gdb-detach { resume }
